# Example configuration. Replace the app and volume names for your own account.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'replace-with-your-app-name'
primary_region = 'dfw'

[build]

[env]
  AUDIO_DIR = '/data/audio_fma'
  DB_PATH = '/data/data.db'
  EVAL_COLLECTION_OPEN = 'false'

[[mounts]]
  source = 'replace_with_your_volume'
  destination = '/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
